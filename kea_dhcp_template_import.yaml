                - '$["pkt4-ack-sent"][0][0]'
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          master_item:
            key: 'kea.stats["{$KEA.DHCP4.SESSION}","statistic-get-all","dhcp4"]'
          tags:
            - tag: component
              value: dhcp
        - uuid: def89db6193c4d199b4d6252640df4c6
          name: 'Kea DHCP4: Declines received'
          type: DEPENDENT
          key: kea.dhcp4.pkt4_decline_received
          delay: '0'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$["pkt4-decline-received"][0][0]'
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          master_item:
            key: 'kea.stats["{$KEA.DHCP4.SESSION}","statistic-get-all","dhcp4"]'
          tags:
            - tag: component
              value: dhcp
          triggers:
            - uuid: d74fd13f27ad47b6b262d0b6b9669379
              expression: 'rate(/Kea DHCP4 by Zabbix agent 2/kea.dhcp4.pkt4_decline_received,1h)>={$KEA.DHCP4.DECLINE_WARN}'
              name: 'Abnormal amount of DHCP Declines within last hour'
              opdata: 'Fails: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: |
                An abnormal amount of DHCP declines has been received from client to the DHCP server within the last hour. This may indicate some odd network condition where clients are refusing leases from the server.
                
                This may also be normal depending on network design. Review the Kea logs and determine, alter {$KEA.DHCP4.DECLINE_WARN} if needed.
              manual_close: 'YES'
              tags:
                - tag: component
                  value: dhcp
        - uuid: 9d5e800231ca4a97b0c5a0b72fe46511
          name: 'Kea DHCP4: Discovers received'
