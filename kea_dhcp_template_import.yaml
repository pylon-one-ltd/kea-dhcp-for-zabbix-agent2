zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
      name: Templates/Applications
  templates:
    - uuid: c44efd0253f24958bc7846ba6b4ed0a9
      template: 'Kea DHCP4 by Zabbix agent 2'
      name: 'Kea DHCP4 by Zabbix agent 2'
      description: 'Monitors ISC Kea DHCP4 server metrics and automatically discovers subnet CIDRs.'
      groups:
        - name: Templates/Applications
      items:
        - uuid: e4dd113a8eef421eb707ada8f21017f7
          name: 'Kea DHCP4: ACKs received'
          type: DEPENDENT
          key: kea.dhcp4.pkt4_ack_received
          delay: '0'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$["pkt4-ack-received"][0][0]'
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          master_item:
            key: 'kea.stats["{$KEA.DHCP4.SESSION}","statistic-get-all","dhcp4"]'
          tags:
            - tag: component
              value: dhcp
        - uuid: 9c4302020d3748c2bee65ea109ac6bb8
          name: 'Kea DHCP4: ACKs sent'
          type: DEPENDENT
          key: kea.dhcp4.pkt4_ack_sent
          delay: '0'
