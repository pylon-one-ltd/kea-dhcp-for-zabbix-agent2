          tags:
            - tag: component
              value: dhcp
          triggers:
            - uuid: 4b3000e135c14e659096fc0f0302343a
              expression: 'rate(/Kea DHCP4 by Zabbix agent 2/kea.dhcp4.pkt4_request_dropped,1h)>0'
              name: 'IPv4 Request Drops present within last hour'
              opdata: 'Fails: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'Kea has reported a number of inbound IPv4 packets being dropped. Review the logs to identify if this is expected behaviour.'
              manual_close: 'YES'
              tags:
