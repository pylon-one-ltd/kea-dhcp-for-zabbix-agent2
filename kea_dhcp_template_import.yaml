        - uuid: 1c3a3f6fbf4a4350ae547fdd93a4383f
          name: 'Kea DHCP4: Allocation Fails'
          type: DEPENDENT
          key: kea.dhcp4.v4_allocation_fail
          delay: '0'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$["v4-allocation-fail"][0][0]'
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          master_item:
            key: 'kea.stats["{$KEA.DHCP4.SESSION}","statistic-get-all","dhcp4"]'
          tags:
            - tag: component
              value: dhcp
          triggers:
            - uuid: 58e3fb2e3c1d48e9a4665d7d33333494
              expression: 'rate(/Kea DHCP4 by Zabbix agent 2/kea.dhcp4.v4_allocation_fail,1h)>0'
              name: 'IPv4 Allocation Fails present within last hour'
              opdata: 'Fails: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: |
                Kea has reported that it was unable to allocate some addresses to clients. This may be because the client sent a request from a subnet that no pool is configured for, or a pool is full.
                
                Investigate if the request is legitimate, and if there is a configuration error or exhausted pool. If not, remove any dhcp relay from the network to prevent sending DHCP requests from a network this Kea server does not service.
              manual_close: 'YES'
              tags:
                - tag: component
                  value: dhcp
        - uuid: 9d1d3ce800af4a528c4dd08b463f554e
          name: 'Kea DHCP4: Subnets (Master)'
          key: 'kea.subnets["{$KEA.DHCP4.SESSION}","dhcp4"]'
          description: 'Configured subnets (ID, prefix, name), read by the plugin from config-get. The rest of the Kea configuration never leaves the agent.'
          history: '0'
          value_type: TEXT
          trends: '0'
          tags:
            - tag: component
              value: raw
        - uuid: d6ab4a83cace426692b8b08b8beed84d
          name: 'Kea DHCP4: Get stats (Master)'
          key: 'kea.stats["{$KEA.DHCP4.SESSION}","statistic-get-all","dhcp4"]'
          history: '0'
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  try {
                      var data = JSON.parse(value);
                      if (Array.isArray(data)) { data = data[0]; }
                      return JSON.stringify(data.arguments || {});
                  } catch (e) { return value; }
          tags:
            - tag: component
              value: raw
      discovery_rules:
        - uuid: 8d6556e5beb049fa99468fc88819d647
          name: 'Kea Subnet Discovery'
          type: DEPENDENT
          key: kea.dhcp4.subnet.discovery
          delay: '0'
          item_prototypes:
            - uuid: d64183dd105947a6a11db9dcd5bb4666
              name: 'Subnet {#SUBNET_ID} ({#SUBNET_NAME}): Assigned addresses'
              type: DEPENDENT
              key: 'kea.dhcp4.subnet.assigned_addresses[{#SUBNET_ID}]'
              delay: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$["subnet[{#SUBNET_ID}].assigned-addresses"][0][0]'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
              master_item:
                key: 'kea.stats["{$KEA.DHCP4.SESSION}","statistic-get-all","dhcp4"]'
              tags:
                - tag: component
                  value: dhcp
                - tag: metric
                  value: utilisation
            - uuid: 2feb18c4eda34704a8dedb7216a0d081
              name: 'Subnet {#SUBNET_ID} ({#SUBNET_NAME}): Declined addresses'
              type: DEPENDENT
              key: 'kea.dhcp4.subnet.declined_addresses[{#SUBNET_ID}]'
              delay: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$["subnet[{#SUBNET_ID}].declined-addresses"][0][0]'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
              master_item:
                key: 'kea.stats["{$KEA.DHCP4.SESSION}","statistic-get-all","dhcp4"]'
              tags:
                - tag: component
                  value: dhcp
                - tag: metric
                  value: abnormals
            - uuid: 049718352eb04dd280a1abb67a0d63c9
              name: 'Subnet {#SUBNET_ID} ({#SUBNET_NAME}): Reclaimed declined addresses'
              type: DEPENDENT
              key: 'kea.dhcp4.subnet.reclaimed_declined_addresses[{#SUBNET_ID}]'
              delay: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$["subnet[{#SUBNET_ID}].reclaimed-declined-addresses"][0][0]'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
              master_item:
                key: 'kea.stats["{$KEA.DHCP4.SESSION}","statistic-get-all","dhcp4"]'
              tags:
                - tag: component
                  value: dhcp
                - tag: metric
                  value: abnormals
            - uuid: 780af8e97e8c4f109286e56aaf6939a9
              name: 'Subnet {#SUBNET_ID} ({#SUBNET_NAME}): Reclaimed leases'
              type: DEPENDENT
              key: 'kea.dhcp4.subnet.reclaimed_leases[{#SUBNET_ID}]'
              delay: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$["subnet[{#SUBNET_ID}].reclaimed-leases"][0][0]'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
              master_item:
                key: 'kea.stats["{$KEA.DHCP4.SESSION}","statistic-get-all","dhcp4"]'
              tags:
                - tag: component
                  value: dhcp
                - tag: metric
                  value: abnormals
            - uuid: 05b4cc19953746c191e60ee177dd54d3
              name: 'Subnet {#SUBNET_ID} ({#SUBNET_NAME}): Total addresses'
              type: DEPENDENT
              key: 'kea.dhcp4.subnet.total_addresses[{#SUBNET_ID}]'
              delay: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$["subnet[{#SUBNET_ID}].total-addresses"][0][0]'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
              master_item:
                key: 'kea.stats["{$KEA.DHCP4.SESSION}","statistic-get-all","dhcp4"]'
              tags:
                - tag: component
                  value: dhcp
                - tag: metric
                  value: utilisation
            - uuid: fabb10863b114d7caab1d118784ae274
              name: 'Subnet {#SUBNET_ID} ({#SUBNET_NAME}): Percent Utilised'
              type: CALCULATED
              key: 'kea.dhcp4.subnet.utilised[{#SUBNET_ID}]'
              units: '%'
              params: |
                100 * (last(//kea.dhcp4.subnet.assigned_addresses[{#SUBNET_ID}]) +
                last(//kea.dhcp4.subnet.declined_addresses[{#SUBNET_ID}])) /
                last(//kea.dhcp4.subnet.total_addresses[{#SUBNET_ID}])
              description: 'The utilisation percentage of the pool based on the total addresses and assigned addresses'
              tags:
                - tag: component
                  value: dhcp
                - tag: metric
                  value: utilisation
              trigger_prototypes:
                - uuid: 05d62a9299bc4c739aff25b7512e1740
                  expression: 'last(/Kea DHCP4 by Zabbix agent 2/kea.dhcp4.subnet.utilised[{#SUBNET_ID}])>{$KEA.DHCP4.UTILISATION_CRIT}'
                  name: 'Subnet {#SUBNET_ID} ({#SUBNET_NAME}) - Critical pool utilisation'
                  opdata: 'Percent Utilised: {ITEM.LASTVALUE1}'
                  priority: HIGH
                  description: 'The utilisation of the DHCP pool is at a critical level threshold'
                  tags:
                    - tag: component
                      value: dhcp
                    - tag: metric
                      value: utilisation
                - uuid: f1a4fe7410bb4388b3955928a4cf36a6
                  expression: 'last(/Kea DHCP4 by Zabbix agent 2/kea.dhcp4.subnet.utilised[{#SUBNET_ID}])>{$KEA.DHCP4.UTILISATION_WARN}'
                  name: 'Subnet {#SUBNET_ID} ({#SUBNET_NAME}) - High pool utilisation'
                  opdata: 'Percent Utilised: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'The utilisation of the DHCP pool is at a warning level threshold'
                  dependencies:
                    - name: 'Subnet {#SUBNET_ID} ({#SUBNET_NAME}) - Critical pool utilisation'
                      expression: 'last(/Kea DHCP4 by Zabbix agent 2/kea.dhcp4.subnet.utilised[{#SUBNET_ID}])>{$KEA.DHCP4.UTILISATION_CRIT}'
                  tags:
                    - tag: component
                      value: dhcp
                    - tag: metric
                      value: utilisation
            - uuid: 1bc6de3db19648ee8b345abfc6a2a92d
              name: 'Subnet {#SUBNET_ID} ({#SUBNET_NAME}): v4 Lease Reuses'
              type: DEPENDENT
              key: 'kea.dhcp4.subnet.v4_lease_reuses[{#SUBNET_ID}]'
              delay: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$["subnet[{#SUBNET_ID}].v4-lease-reuses"][0][0]'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
              master_item:
                key: 'kea.stats["{$KEA.DHCP4.SESSION}","statistic-get-all","dhcp4"]'
              tags:
                - tag: component
                  value: dhcp
                - tag: metric
                  value: abnormals
            - uuid: 7650450fb44643d8970e636cf0613f9b
              name: 'Subnet {#SUBNET_ID} ({#SUBNET_NAME}): v4 Reservation Conflicts'
              type: DEPENDENT
              key: 'kea.dhcp4.subnet.v4_reservation_conflicts[{#SUBNET_ID}]'
              delay: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$["subnet[{#SUBNET_ID}].v4-reservation-conflicts"][0][0]'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
              master_item:
                key: 'kea.stats["{$KEA.DHCP4.SESSION}","statistic-get-all","dhcp4"]'
              tags:
                - tag: component
                  value: dhcp
                - tag: metric
                  value: utilisation
          master_item:
            key: 'kea.subnets["{$KEA.DHCP4.SESSION}","dhcp4"]'
          lld_macro_paths:
            - lld_macro: '{#SUBNET_ID}'
              path: $.id
            - lld_macro: '{#SUBNET_NAME}'
              path: $.name
      macros:
        - macro: '{$KEA.DHCP4.DECLINE_WARN}'
          value: '1'
          description: 'Threshold to alert on abnormal amounts of DHCP Declines within 1 hour'
        - macro: '{$KEA.DHCP4.SESSION}'
          value: dhcp4
          description: 'Name of the Kea session defined in the agent config (Plugins.KeaDHCP.Sessions.<name>.Uri).'
        - macro: '{$KEA.DHCP4.UTILISATION_CRIT}'
          value: '90'
          description: 'Threshold to alert critical on DHCP pool utilisation'
        - macro: '{$KEA.DHCP4.UTILISATION_WARN}'
          value: '70'
          description: 'Threshold to alert warning on DHCP pool utilisation'
    - uuid: 8514fe238119463a84df9379071201b2
      template: 'Kea DHCP6 by Zabbix agent 2'
      name: 'Kea DHCP6 by Zabbix agent 2'
      description: 'Monitors ISC Kea DHCP6 server metrics and automatically discovers subnet CIDRs.'
      groups:
